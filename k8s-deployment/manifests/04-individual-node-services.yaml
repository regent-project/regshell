---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-node-1
  namespace: default
spec:
  type: NodePort
  selector:
    pod-name: node-1
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 30101
    protocol: TCP

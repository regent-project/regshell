---
apiVersion: v1
kind: Pod
metadata:
  name: ssh-bastion
  namespace: default
  labels:
    app: ssh-bastion
spec:
  containers:
  - name: bastion
    image: ubuntu:22.04
    command: ["/bin/bash", "-c"]
    args:
      - |
        set -e

        # Install OpenSSH server and client
        apt-get update && apt-get install -y openssh-server openssh-client

        # Generate SSH host keys
        ssh-keygen -A

        # Configure SSH
        mkdir -p /root/.ssh /var/run/sshd
        chmod 700 /root/.ssh

        # Add authorized key
        # NOTE: Replace this with your own public key
        cat > /root/.ssh/authorized_keys << 'EOF'
        # ADD YOUR SSH PUBLIC KEY HERE
        # Example: ssh-ed25519 AAAAC3... user@example.com
        EOF
        chmod 600 /root/.ssh/authorized_keys

        # Configure sshd with proper forwarding
        cat >> /etc/ssh/sshd_config << 'SSHEOF'
        PermitRootLogin yes
        PubkeyAuthentication yes
        AllowTcpForwarding yes
        AllowStreamLocalForwarding yes
        PermitOpen any
        GatewayPorts yes
        SSHEOF

        # Start SSH daemon
        echo "Starting SSH bastion..."
        /usr/sbin/sshd -D -e
    ports:
    - containerPort: 22
      name: ssh
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-bastion
  namespace: default
spec:
  type: NodePort
  selector:
    app: ssh-bastion
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 30222
    protocol: TCP

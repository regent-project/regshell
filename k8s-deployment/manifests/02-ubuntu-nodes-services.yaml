---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-test-nodes-service
  namespace: default
  labels:
    app: ubuntu-test-nodes
spec:
  type: ClusterIP
  selector:
    app: ubuntu-test-node
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    protocol: TCP
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-test-nodes-nodeport
  namespace: default
  labels:
    app: ubuntu-test-nodes
spec:
  type: NodePort
  selector:
    app: ubuntu-test-node
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 30022
    protocol: TCP
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
